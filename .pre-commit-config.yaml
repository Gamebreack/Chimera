# Git hooks (pre-commit framework). Install once per clone: `pre-commit install` (installs the commit and push hooks).
# Run all commit-stage hooks: `pre-commit run --all-files`. Never bypass with --no-verify.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # stages pinned: these hooks' manifests also declare other stages; all are pinned for consistency.
      # Patches are excluded: a blank context line in a unified diff is a single space,
      # and the example records each patch's SHA-256.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.patch$
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: \.patch$
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-merge-conflict
        args: [--assume-in-merge]
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  - repo: local
    hooks:
      # Limit lives in AGENTS.md (Hard rules); the script holds the numbers and the exempt list.
      - id: doc-length
        name: doc line limits (CONTEXT.md < 80, other Markdown < 200)
        entry: scripts/check-doc-length.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: validate
        name: chimera validator (skill, record, fixture)
        entry: python3 scripts/validate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # The lookbehind skips URL paths (https://host/home/x). This config is excluded because the regex text itself contains the prefixes.
      - id: no-absolute-home-path
        name: portability guard (no absolute home paths)
        description: Machine-specific paths never enter this repo (see AGENTS.md).
        entry: '(?<![A-Za-z0-9._~-])(/home/|/Users/)[A-Za-z0-9._-]+'
        language: pygrep
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$
        stages: [pre-commit]

      - id: no-env-file
        name: secrets guard (no .env files)
        entry: .env files must not be committed
        language: fail
        files: (^|/)\.env(\..*)?$
        stages: [pre-commit]

      # Whole-repo guards (tracked .env files, home paths), then the checks CI runs; does not re-invoke pre-commit (no recursion).
      - id: pre-push-checks
        name: pre-push checks (.env, home paths, doc length, validator, tests)
        entry: scripts/hooks/pre_push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
